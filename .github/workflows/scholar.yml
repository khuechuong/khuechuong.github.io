name: Update Google Scholar citations

on:
  schedule:
    - cron: "0 6 * * *"   # daily at 06:00 UTC (~31 SerpAPI lookups/month; free tier is 100)
  workflow_dispatch:      # manual "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: scholar
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 .github/scripts/update_scholar.py
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/scholar.json
          if git diff --cached --quiet; then
            echo "Citation count unchanged."
          else
            git commit -m "Update Scholar citation count"
            git pull --rebase
            git push
          fi
